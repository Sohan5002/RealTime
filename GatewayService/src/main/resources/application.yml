server:
  port: 8082

spring:
  application:
    name: gateway-service
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

  # Redis Configuration (optional, for connection management)
  data:
    redis:
      host: localhost
      port: 6379

# JWT Configuration (must match AuthService)
jwt:
  secret: MySuperSecretKeyForJWTTokenGeneration123456789
  expiration: 86400000  # 24 hours

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.example.GatewayService: DEBUG

