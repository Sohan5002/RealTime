# ===============================
#  BASIC APP CONFIGURATION
# ===============================
spring.application.name=GatewayService
server.port=8082

# ===============================
#  KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=gateway-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka topics (used for chat messages)
chat.topic.send=chat.send
chat.topic.receive=chat.receive

# ===============================
#  REDIS CONFIGURATION (optional)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
#  JWT CONFIGURATION
# ===============================
jwt.secret=MySuperSecretKeyForJWT
jwt.expiration=86400000  # 1 day in milliseconds

# ===============================
#  LOGGING (for debugging)
# ===============================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.socket=DEBUG
logging.level.com.example.GatewayService=DEBUG
ws.jwt.secret=MySuperSecretKeyForWebSocket123456789

spring.docker.compose.enabled=false
