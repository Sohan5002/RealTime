<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Simple Chat UI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">Conversations</aside>
    <main class="chat">
      <div id="messageList" class="message-list"></div>
      <div class="input-bar">
        <textarea id="txt" placeholder="Type..."></textarea>
        <button id="send">Send</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
