server:
  port: 8083

spring:
  application:
    name: chat-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/chat_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Sohan@123#
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.ChatService.DTO.MessageDTO
        spring.json.trusted.packages: com.example.ChatService.DTO

# JWT Configuration (must match AuthService)
jwt:
  secret: MySuperSecretKeyForJWTTokenGeneration123456789
  expiration: 86400000

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Logging
logging:
  level:
    com.example.ChatService: DEBUG
    org.springframework.messaging: DEBUG
    org.springframework.web.socket: DEBUG

