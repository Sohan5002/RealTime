# Server
server.port=8081
  
  # Application
spring.application.name=auth-service
  
  # Database
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sohan@123#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
  
  # JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
  
  # JWT
jwt.secret=MySuperSecretKeyForJWTTokenGeneration123456789
jwt.expiration=86400000
  
  # Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
  
  # Logging
logging.level.com.example.AuthService=DEBUG
